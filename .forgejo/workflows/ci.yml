# murasame gates its own PRs with this workflow: it pushes each merged result to
# murasame/staging and waits for "ci / test (push)".
name: ci

on:
  push:
    branches: [murasame/staging]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: timeout 10m go test ./tests/
