[repo]
target = ["main", "master"]
state_dir = "{repo}/.murasame"
integ = "{state_dir}/integ"

[merge]
no_ff = true

# The gate is Forgejo Actions. murasame pushes each merged result to the staging
# branch and waits for the commit statuses of these jobs (see
# examples/forgejo-workflow.yml).
[ci]
staging = "murasame/staging"
contexts = ["ci / check (push)"]
timeout = 3600
start_timeout = 900
poll_interval = 15

[[conflicts]]
label = "docs"
paths = ["CHANGELOG.md", "docs/*.md"]
strategy = "keep-both"

[records]
enabled = true

[forgejo]
url = "${MURASAME_FORGEJO_URL:-}"
owner = "${MURASAME_FORGEJO_OWNER:-}"
repo = "${MURASAME_FORGEJO_REPO:-}"
git_remote_url = "${MURASAME_GIT_URL:-}"
bot_user = "murasame"
reviewers_from_permission = "write"
batch_max = 8
poll_interval = 60
