[instance]
bot_user = "murasame"
listen = "127.0.0.1:8737"
webhook_secret_env = "MURASAME_WEBHOOK_SECRET"
state_dir = "${MURASAME_STATE:-/var/lib/murasame}"
db = "murasame.sqlite3"
poll_interval = 60
external_url = ""

[forges.main]
url = "${MURASAME_FORGEJO_URL:-http://127.0.0.1:3000}"
token_env = "MURASAME_FORGEJO_TOKEN"

[[repos]]
repository = "team/app"
include = "generic.toml"

[repos.repo]
target = ["main"]

[repos.forgejo]
reviewers = ["alice", "bob"]
reviewers_from_permission = ""
batch_max = 4

[[repos]]
repository = "team/handbook"
name = "docs"

[repos.repo]
target = ["main"]
pair_check = false

[repos.ci]
contexts = ["docs / build (push)"]
timeout = 1800

[[repos.conflicts]]
label = "docs"
paths = ["**/*.md"]
strategy = "keep-both"

[repos.forgejo]
reviewers_from_permission = "write"
